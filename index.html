<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>worldgen</title>
    <link data-trunk rel="rust" data-wasm-opt="s" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d12; color: #ddd; font-family: system-ui, sans-serif; }
      #world { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: crosshair; }
      #error { position: fixed; inset: 0; display: grid; place-items: center; padding: 2rem; text-align: center; }
      /* display: grid above beats the UA's [hidden] rule; without this the
         empty overlay covers the canvas and swallows all pointer events. */
      #error[hidden] { display: none; }
      #panel {
        position: fixed; top: 12px; left: 12px; width: min(300px, calc(100vw - 24px));
        display: flex; flex-direction: column; gap: 8px;
        font-size: 13px; line-height: 1.45; user-select: none;
      }
      .card { padding: 10px 12px; border-radius: 8px; background: rgba(10, 12, 18, 0.75); }
      /* The HUD is read-only; let pointer events reach the globe under it. */
      #hud { pointer-events: none; }
      .tray h2 { margin: 0 0 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #8a93a6; }
      .tray h2:not(:first-child) { margin-top: 10px; }
      .tray label { display: flex; align-items: center; gap: 8px; padding: 2px 0; cursor: pointer; }
      .tray input { margin: 0; accent-color: #4de6ff; cursor: pointer; }
      .tray .world { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      #world-seed { font-variant-numeric: tabular-nums; color: #bbb; }
      .tray button {
        font: inherit; color: #ddd; background: #232838; border: 1px solid #39405a;
        border-radius: 6px; padding: 3px 10px; cursor: pointer;
      }
      .tray button:hover { background: #2c3347; }
      /* Performance panel, filled in by web.rs. */
      #perf {
        position: fixed; right: 12px; bottom: 12px; width: min(260px, calc(100vw - 24px));
        font-size: 12px; line-height: 1.4; user-select: none; pointer-events: none;
      }
      #perf h2 { margin: 0 0 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #8a93a6; }
      #perf dl { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; margin: 0; font-variant-numeric: tabular-nums; }
      #perf dt { color: #8a93a6; }
      #perf dd { margin: 0; text-align: right; }
      #perf p { margin: 4px 0 0; color: #8a93a6; font-size: 11px; }
      /* Color key, filled in by legend.rs. */
      #legend {
        position: fixed; top: 12px; right: 12px; width: min(240px, calc(100vw - 24px));
        max-height: calc(100vh - 24px); overflow-y: auto;
        font-size: 12px; line-height: 1.4; user-select: none;
      }
      #legend:empty { display: none; }
      #legend h2 { margin: 0 0 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #8a93a6; }
      #legend h2:not(:first-child) { margin-top: 12px; }
      #legend p { margin: 4px 0; color: #a9b0c0; }
      #legend .bar { height: 12px; border-radius: 3px; }
      #legend .ticks { position: relative; height: 16px; margin: 2px 8px 2px; font-size: 11px; font-variant-numeric: tabular-nums; color: #c3c9d6; }
      #legend .ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
      #legend .row { display: flex; align-items: center; gap: 8px; padding: 1px 0; }
      #legend .swatch { width: 12px; height: 12px; border-radius: 2px; flex: none; }
      #legend .line { width: 16px; height: 3px; border-radius: 2px; flex: none; }
      #legend .ring { border: 2px solid; border-radius: 50%; box-sizing: border-box; margin: 0 2px; flex: none; }
      #legend .arrow { width: 16px; font-weight: 700; text-align: center; flex: none; }
      #legend .plates { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px 8px; font-variant-numeric: tabular-nums; }
      #legend .plates i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; border-radius: 2px; vertical-align: -1px; }
      /* On narrow screens the key sits at the bottom so it clears the left panel. */
      @media (max-width: 700px) {
        #legend { top: auto; bottom: 12px; max-height: 40vh; }
        #perf { bottom: auto; top: 12px; }
      }
      #hud-cursor { font-variant-numeric: tabular-nums; font-weight: 600; }
      #hud-cell { font-variant-numeric: tabular-nums; }
      #hud-cell:empty, #hud-crust:empty, #hud-deep:empty { display: none; }
      #hud-crust { font-variant-numeric: tabular-nums; }
      #measure .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
      #measure h2 { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #8a93a6; }
      #measure dl { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; margin: 0; font-variant-numeric: tabular-nums; }
      #measure dt { color: #8a93a6; }
      #measure dd { margin: 0; }
      #measure .help { margin-top: 4px; }
      #measure-copy {
        display: grid; place-items: center; width: 26px; height: 26px; padding: 0;
        color: #ddd; background: #232838; border: 1px solid #39405a; border-radius: 6px; cursor: pointer;
      }
      #measure-copy:hover { background: #2c3347; }
      /* After copying, the clipboard icon briefly becomes a check mark. */
      #measure-copy .check, #measure-copy.copied .clip { display: none; }
      #measure-copy.copied .check { display: block; color: #6ced94; }
      .help { color: #8a93a6; font-size: 12px; }
    </style>
  </head>
  <body>
    <canvas id="world"></canvas>
    <div id="panel">
      <div id="hud" class="card">
        <div id="hud-cursor"></div>
        <div id="hud-cell"></div>
        <div id="hud-crust"></div>
        <div id="hud-deep"></div>
        <div class="help">
          Drag: move · Wheel: zoom<br />
          Click: measure from a point, click again to finish
        </div>
      </div>
      <div id="measure" class="card" hidden>
        <div class="head">
          <h2>Measurement</h2>
          <button type="button" id="measure-copy" title="Copy to clipboard" aria-label="Copy measurement to clipboard">
            <svg class="clip" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="8" y="2" width="8" height="4" rx="1" />
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
            </svg>
            <svg class="check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 6 9 17l-5-5" />
            </svg>
          </button>
        </div>
        <dl>
          <dt>Source</dt><dd id="measure-source"></dd>
          <dt>Bearing</dt><dd id="measure-bearing"></dd>
          <dt>Distance</dt><dd id="measure-distance"></dd>
        </dl>
        <div id="measure-status" class="help"></div>
      </div>
      <div class="card tray">
        <h2>Color by</h2>
        <label><input type="radio" name="color" id="color-elevation" checked /> Elevation</label>
        <label><input type="radio" name="color" id="color-plates" /> Plates</label>
        <label><input type="radio" name="color" id="color-age" /> Seafloor age</label>
        <label><input type="radio" name="color" id="color-crust" /> Crust type and thickness</label>
        <label><input type="radio" name="color" id="color-mantle" /> Mantle (rising / sinking)</label>
        <h2>Surface</h2>
        <label><input type="checkbox" id="layer-boundaries" checked /> Plate boundaries</label>
        <label><input type="checkbox" id="layer-motion" /> Plate motion</label>
        <label><input type="checkbox" id="layer-graticule" checked /> Graticule</label>
        <h2>Deep earth</h2>
        <label><input type="checkbox" id="layer-mantle" /> Mantle flow</label>
        <label><input type="checkbox" id="layer-provinces" /> Deep mantle provinces</label>
        <label><input type="checkbox" id="layer-hotspots" /> Hotspots</label>
        <label><input type="checkbox" id="layer-tracks" /> Hotspot tracks</label>
        <h2>Projection</h2>
        <label><input type="radio" name="projection" id="proj-globe" checked /> Globe</label>
        <label><input type="radio" name="projection" id="proj-equirectangular" /> Cylindrical (equirectangular)</label>
        <label><input type="radio" name="projection" id="proj-mercator" /> Cylindrical (Mercator)</label>
        <label><input type="radio" name="projection" id="proj-albers" /> Conic (Albers equal-area)</label>
        <label><input type="radio" name="projection" id="proj-azimuthal" /> Azimuthal (equidistant, both hemispheres)</label>
        <h2>Diagnostics</h2>
        <label><input type="checkbox" id="perf-stats" /> Performance stats</label>
        <h2>World</h2>
        <div class="world">
          <span id="world-seed"></span>
          <button type="button" id="new-world">New world</button>
        </div>
      </div>
    </div>
    <div id="legend" class="card"></div>
    <div id="perf" class="card" hidden>
      <h2>Performance</h2>
      <div id="perf-body"></div>
      <p>FPS is capped at the display's refresh rate (vsync).</p>
    </div>
    <div id="error" hidden></div>
  </body>
</html>
