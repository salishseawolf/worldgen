server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve the .gz files precompressed in the build stage.
    gzip_static on;
    gzip_vary on;

    # Trunk adds a content hash to asset names, so they never change.
    location ~ "-[0-9a-f]{16}(_bg)?\.(js|wasm)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else, index.html included, is revalidated on each load.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
